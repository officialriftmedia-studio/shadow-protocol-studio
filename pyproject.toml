[project]
name = "shadow-protocol-studio"
version = "0.1.0"
description = "AI-native automated YouTube production studio for the Shadow Protocol universe"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "jsonschema>=4.20",
]

[project.scripts]
shadow-protocol = "shadow_protocol.cli:main"
create-video = "shadow_protocol.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shadow_protocol*"]

[tool.setuptools.package-data]
shadow_protocol = ["py.typed"]
